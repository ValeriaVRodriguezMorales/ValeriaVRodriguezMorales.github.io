name: Generar esquema de TinaCMS sin Codespaces

on:
  push:
    branches:
      - tina-pruebas
    paths:
      - '.github/workflows/generar-tina-lock.yml'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama de pruebas
        uses: actions/checkout@v4
        with:
          ref: tina-pruebas
          persist-credentials: true

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias del proyecto
        run: npm install --no-audit --no-fund

      - name: Generar el tina-lock.json con el editor de desarrollo
        shell: bash
        run: |
          set -euo pipefail
          export NODE_ENV=development
          npm run dev > "$RUNNER_TEMP/tina-dev.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if test -s tina/tina-lock.json; then
              echo 'Se generó tina/tina-lock.json'
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo 'El servidor de desarrollo terminó antes de generar el archivo.'
              tail -n 80 "$RUNNER_TEMP/tina-dev.log"
              exit 1
            fi
            sleep 2
          done
          if ! test -s tina/tina-lock.json; then
            echo 'No se generó tina/tina-lock.json en el plazo de la prueba.'
            tail -n 80 "$RUNNER_TEMP/tina-dev.log"
            exit 1
          fi

      - name: Guardar solamente el esquema generado en tina-pruebas
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tina/tina-lock.json
          if git diff --cached --quiet; then
            echo 'El esquema ya estaba actualizado.'
          else
            git commit -m 'Generar esquema de TinaCMS para pruebas'
            git push origin HEAD:tina-pruebas
          fi
